name: fleet-manager-backend

# Local PostgreSQL only. Migrations remain an explicit Node command.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fleet
      POSTGRES_USER: fleet_owner
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD outside the repository}
    ports:
      - "5432:5432"
    volumes:
      - fleet_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet_owner -d fleet"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fleet_pgdata:
